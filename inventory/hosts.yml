---
all:
  children:
    servers:
      hosts:
        homeserver:
          ansible_connection: local
          ansible_become: true
          ansible_become_method: sudo

    lab:
      hosts:
        practice:
          ansible_connection: community.general.incus
          ansible_incus_remote: local
          # Already root inside the container; no sudo present.
          ansible_become: false

---
- name: Add Docker's signing key
  ansible.builtin.get_url:
    url: "{{ docker_signing_key_url }}"
    dest: /etc/apt/keyrings/docker.asc
    checksum: "sha256:{{ docker_signing_key_sha256 }}"
    mode: "0644"
  become: true


- name: Remove old docker.list
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent
  become: true

- name: Remove old docker.gpg
  ansible.builtin.file:
    path: /etc/apt/keyrings/docker.gpg
    state: absent
  become: true

- name: Add Docker's apt repository
  ansible.builtin.deb822_repository:
    name: docker
    uris: "{{ docker_repo_uris }}"
    signed_by: /etc/apt/keyrings/docker.asc
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: "{{ docker_repo_components }}"
    architectures: "{{ docker_architectures }}"
    state: present
  become: true

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
  changed_when: false
  become: true

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
  become: true

- name: Ensure users are in the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"
  become: true

- name: Configure Docker daemon
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    validate: python3 -c "import json, sys; json.load(open(sys.argv[1]))" %s
  become: true
  notify: Restart Docker

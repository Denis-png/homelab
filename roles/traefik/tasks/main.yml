---
- name: Render Traefik dynamic routes
  ansible.builtin.template:
    src: route.yml.j2
    dest: "{{ traefik_dynamic_dir }}/{{ item.key }}.yml"
    owner: denispng
    group: denispng
    mode: "0644"
  loop: "{{ services | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    svc_name: "{{ item.key }}"
    svc: "{{ item.value }}"
  become: true

- name: Find existing route files
  ansible.builtin.find:
    paths: "{{ traefik_dynamic_dir }}"
    patterns: "*.yml"
  register: traefik_existing
  become: true

- name: Remove route files not defined in the service inventory
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ traefik_existing.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when:
    - (item.path | basename | splitext | first) not in services
    - (item.path | basename | splitext | first) not in traefik_legacy_routes
  become: true

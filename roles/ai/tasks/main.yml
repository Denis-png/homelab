---
- name: Render the ai stack compose file
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /srv/homelab/ai/docker-compose.yml
    owner: denispng
    group: denispng
    mode: "0644"
  become: true

- name: Deploy the ai stack
  community.docker.docker_compose_v2:
    project_src: /srv/homelab/ai
    state: present
  become: true
